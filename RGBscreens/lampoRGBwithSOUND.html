<html><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://oocsi.id.tue.nl/assets/images/OOCSI_logo_no_text.png">
  <link rel="manifgest" href="manifest.json">
  <link rel="stylesheet" type="text/css" href="https://oocsi.id.tue.nl/assets/css/pico.indigo.min.css" class="native-dark-class-original">
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/p5.min.js"></script><link type="text/css" rel="stylesheet" id="dark-mode-custom-link"><link type="text/css" rel="stylesheet" id="dark-mode-general-link"><style lang="en" type="text/css" id="dark-mode-custom-style"></style><style lang="en" type="text/css" id="dark-mode-native-style"></style><style lang="en" type="text/css" id="dark-mode-native-sheet"></style>
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/oocsi-web.js"></script>
  <script type="text/javascript" src="https://oocsi.id.tue.nl/assets/js/things/oocsi-things.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style></style></head>
<body>
    <div id="header"></div>
    <div id="gif-container" style="position:fixed; inset:0; display:flex; justify-content:center; align-items:center; z-index:10; pointer-events:none;"></div>    <div id="canvasContainer"><dialog id="team-modal" open=""><article>
      <h2><a href="index.html" style="color: var(--pico-h2-color); text-decoration: none;" alt="Back to the overview" title="Back to the overview">OOCSI Things 🌟</a></h2>
      <label for="team-choice">Choose a team:</label>
      <form>
        <fieldset role="group">
          <input list="team-choices" id="team-choice" name="team-choice">
          <datalist id="team-choices">
            <option value="Team 1"></option> <option value="Team 2"></option> <option value="Team 3"></option> <option value="Team 4"></option> <option value="Team 5"></option> <option value="Team 6"></option> <option value="Team 7"></option> <option value="Team 8"></option> <option value="Team 9"></option> <option value="Team 10"></option> <option value="Team 11"></option> <option value="Team 12"></option> <option value="Team 13"></option> <option value="Team 14"></option> <option value="Team 15"></option> <option value="Team 16"></option> <option value="Team 17"></option> <option value="Team 18"></option> <option value="Team 19"></option> <option value="Team 20"></option>
            <option value="Team Test"></option>
          </datalist>
          <input type="submit" value="Go!">
        </fieldset>
      </form>
      <small>
        Connecting via <code>oocsi.id.tue.nl</code>... <a href="#" id="download-source" style="float: right">Download Source</a>
      </small>
    </article></dialog></div>
<script type="text/javascript">

  // register service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.log('Service Worker registration failed', err));
    });
  }

  // define your teamspace if this is predefined no menu of choosing team.
  oocsiThingsConfig = {
    // enter your team name, or leave empty for team selection dialog
    teamspace: "team-1"
  };

  //audio
  const audio = document.createElement("audio");
  audio.src = "./Pitbull, Ke$ha - Timber (featuring Ke$ha - Official Video).mp3"
  //succes
  var succes = new Audio();
  succes.src = "./Success ding Sound Effect (download).mp3"

  //gif
  let  img = document.createElement("img");
  img.src = "pitbull.gif";
  img.style.width = "40vw"; 

  //discobeams color
  let beamColor;
  // thing variables
  let current_state;

  const states = ['black', 'red', 'green', 'blue', 'disco'];

  // NEW: remembers the previous state so we can tell when it changed
  let lastState = null;

  // define thing
  function thing() {

    // register this thing with the name 'Lamporgb' and data path 'lamporgb';
    
    oocsiThings.register('LampoRGB🪩', 'lampoRGB', ['current_state'], [''])

    // define own shared data
    current_state = oocsiThings.data('state');
    console.log('initial state on load:', current_state());

    //Below is subscribing to JJ 'ESP_test_Team_1'
    OOCSI.subscribe('ESP_Test_Team_1', function(message) {
      console.log(message);
      let value = message.data.Message;

      if (value === 0) {
        current_state('black');
      } else if (value === 1) {
        current_state('red');
      } else if (value === 2) {
        current_state('green');
      } else if (value === 3) {
        current_state('blue');
      } else if (value === 4) {
        current_state('disco');
      }
    });
    OOCSI.connect('wss://oocsi.id.tue.nl/ws', OOCSI.handle());
  }

  function setup() {
    let canvas = createCanvas(windowWidth, windowHeight);
    canvas.parent('canvasContainer');
    canvas.style('position', 'fixed');
    canvas.style('top', '0');
    canvas.style('left', '0');
    canvas.style('z-index', '1');

    canvas.style('z-index', '1');
    textAlign(CENTER, CENTER);
  }

  //Keep canvas full screen always!!
  function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
  }

  // NEW: runs ONCE each time the state changes (not every frame)
  // audio + gif live here now instead of inside draw()
  function onStateChange(state) {
    if (state == 'disco') {
      audio.play().catch(e => console.log('audio blocked until user interacts', e));
      document.getElementById("gif-container").appendChild(img);
    } else {
      audio.pause();
      audio.currentTime = 0;
      img.remove();
    }
  }

  function draw() {
  // NEW: compare with the previous state, only react when it is different
  function drawDiscoBeams() {
  push();

  translate(width / 2, height / 2);

  // Rotate the whole beam pattern
  rotate(frameCount * 0.01);

  noStroke();

  // Slightly transparent beams
  fill(255, 255, 255, 35);

  for (let i = 0; i < 8; i++) {
    rotate(TWO_PI / 8);

    triangle(
      0, 0,
      -width * 0.15, -height,
      width * 0.15, -height
    );
  }

  pop();
}

  if (current_state() !== lastState) {
    let newIndex = states.indexOf(current_state());
    let oldIndex = states.indexOf(lastState);

    if (lastState !== null && newIndex > oldIndex && oldIndex >= 0) {
      succes.currentTime = 0;   // restart the sound if it is still playing
      succes.play().catch(e => console.log(e));
      confetti ({ particleCount: 40, spread: 60, zIndex: 99999} )
    }

    lastState = current_state();
    onStateChange(lastState);
  }

  background(0);
    if (current_state() == 'black') {
      fill( 0, 0, 0)
    }
    if (current_state() == 'red') {
      fill( 255, 0, 0 );
    }
    if (current_state() == 'green') {
      fill( 0, 255, 0 );
    }
    if (current_state() == 'blue') {
      fill( 0, 0, 255 );
    }
    
    else if (current_state() == 'disco') {
      let phase = floor(frameCount/ 17) % 7; //make 10 smaller or bigger if u want flash to happen fast (low numbers) vs slow (big numbers)
      confetti({ particleCount: 3, angle: 60,  spread: 55, origin: { x: 0, y: 0.8 }, zIndex: 99999 });  // left cannon
      confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1, y: 0.8 }, zIndex: 99999  });  // right cannon
      drawDiscoBeams();
  
      if (phase == 0) { //red
        fill( 255, 0, 0 );
      } else if (phase == 1) { //oragne
        fill( 255, 150, 0 );
        
      } else if (phase == 2) { //yellow
        fill( 246, 255, 0 );
        
      }else if (phase == 3) { //green
        fill( 8, 255, 0);
        
      }else if (phase == 4) { //cyan
        fill( 0, 255, 255 );
        
      }else if (phase == 5) { //blue
        fill( 0, 0, 255 );
        
      }else {                 //purple
        fill( 255, 0, 238 );
      } 
    }
    rect(50, 50, width-100, height-100);
       if (current_state() == 'black') {
      noStroke();
      fill(255, 60 + 60 * sin(frameCount * 0.05));
      circle(width/2, height/2, 20 + 10 * sin(frameCount * 0.05));
      fill(255, 120);
      textSize(16);
      text("place the vinyl piece...", width/2, height/2 + 50);
    }
    
  }

  

  // react to touch or mouse presses for testing
  function touchEnded() { 
  var states = ['black', 'red', 'green', 'blue', 'disco']
  var currentIndex = states.indexOf(current_state());
  var nextIndex = (currentIndex + 1) % states.length;
  current_state(states[nextIndex]);
  }
</script>
</body></html>
